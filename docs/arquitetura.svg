<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="980" viewBox="0 0 1030 980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Arquitetura do painel do iPad antigo</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1d2340"/>
      <stop offset="1" stop-color="#0b0d17"/>
    </linearGradient>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a84ff"/>
    </marker>
    <marker id="seta-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/>
    </marker>
    <marker id="seta-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64d2ff"/>
    </marker>
    <!-- cadeado -->
    <g id="cadeado">
      <path d="M-4,-1 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#30d158" stroke-width="1.6"/>
      <rect x="-6" y="-1" width="12" height="9" rx="2" fill="#30d158"/>
    </g>
  </defs>

  <rect width="1030" height="980" fill="url(#fundo)"/>

  <!-- Título -->
  <text x="36" y="44" font-size="24" font-weight="700" fill="#f2f2f7">Como o painel funciona</text>
  <text x="36" y="68" font-size="14" fill="#a1a1aa">O GitHub faz todo o trabalho pesado. O iPad só baixa arquivos prontos e cifrados do mesmo site.</text>

  <!-- ===== Fontes na internet ===== -->
  <text x="36" y="100" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8e8e93">FONTES NA INTERNET</text>

  <g font-size="12" fill="#c7c7cc">
    <!-- Notícias -->
    <rect x="36" y="110" width="176" height="96" rx="14" fill="#1f2438" stroke="#3a4060"/>
    <text x="50" y="132" font-size="10.5" font-weight="700" letter-spacing="1" fill="#ff6961">NOTÍCIAS</text>
    <text x="50" y="152" font-size="14" font-weight="600" fill="#f2f2f7">Feeds RSS</text>
    <text x="50" y="172">g1 · BBC Brasil ·</text>
    <text x="50" y="188">Google Notícias</text>

    <!-- Dólar -->
    <rect x="224" y="110" width="176" height="96" rx="14" fill="#1f2438" stroke="#3a4060"/>
    <text x="238" y="132" font-size="10.5" font-weight="700" letter-spacing="1" fill="#ffd60a">DÓLAR</text>
    <text x="238" y="152" font-size="14" font-weight="600" fill="#f2f2f7">AwesomeAPI</text>
    <text x="238" y="172">reserva: PTAX do</text>
    <text x="238" y="188">Banco Central</text>

    <!-- Fotos -->
    <rect x="412" y="110" width="176" height="96" rx="14" fill="#1f2438" stroke="#3a4060"/>
    <text x="426" y="132" font-size="10.5" font-weight="700" letter-spacing="1" fill="#30d158">FOTOS</text>
    <text x="426" y="152" font-size="14" font-weight="600" fill="#f2f2f7">Google Drive</text>
    <text x="426" y="172">uma pasta, lida por</text>
    <text x="426" y="188">conta de serviço</text>

    <!-- Agenda -->
    <rect x="600" y="110" width="176" height="96" rx="14" fill="#1f2438" stroke="#3a4060"/>
    <text x="614" y="132" font-size="10.5" font-weight="700" letter-spacing="1" fill="#bf5af2">AGENDA</text>
    <text x="614" y="152" font-size="14" font-weight="600" fill="#f2f2f7">iCloud (Apple)</text>
    <text x="614" y="172">calendário público,</text>
    <text x="614" y="188">arquivo .ics</text>

    <!-- Tempo -->
    <rect x="788" y="110" width="176" height="96" rx="14" fill="#1f2438" stroke="#3a4060"/>
    <text x="802" y="132" font-size="10.5" font-weight="700" letter-spacing="1" fill="#64d2ff">TEMPO</text>
    <text x="802" y="152" font-size="14" font-weight="600" fill="#f2f2f7">Open-Meteo</text>
    <text x="802" y="172">agora, próximas horas</text>
    <text x="802" y="188">e 6 dias · sem chave</text>
  </g>

  <!-- barramento até o Actions -->
  <g stroke="#0a84ff" stroke-width="2" fill="none">
    <path d="M124,206 V226 M312,206 V226 M500,206 V226 M688,206 V226 M876,206 V226 M124,226 H876"/>
    <path d="M378,226 V284" marker-end="url(#seta)"/>
  </g>

  <!-- ===== GitHub ===== -->
  <rect x="36" y="244" width="928" height="328" rx="20" fill="none" stroke="#4a5070" stroke-dasharray="6 5"/>
  <rect x="50" y="236" width="70" height="16" fill="#151a2e"/>
  <text x="56" y="249" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8e8e93">GITHUB</text>

  <!-- Actions -->
  <rect x="56" y="286" width="640" height="268" rx="16" fill="#1f2438" stroke="#0a84ff" stroke-width="1.5"/>
  <text x="76" y="314" font-size="17" font-weight="700" fill="#f2f2f7">GitHub Actions · workflow “Painel do iPad”</text>
  <text x="76" y="334" font-size="12.5" fill="#a1a1aa">Roda a cada 30 min, a cada push no main e quando você aperta “Run workflow”.</text>

  <g font-size="13" fill="#e5e5ea">
    <g>
      <circle cx="88" cy="366" r="11" fill="#0a84ff"/><text x="88" y="370.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="110" y="363">Baixa tempo, notícias, dólar, agenda e fotos</text>
      <text x="110" y="379" font-size="11.5" fill="#8e8e93" font-family="Menlo, Consolas, monospace">scripts/gerar_dados.py</text>
    </g>
    <g>
      <circle cx="88" cy="406" r="11" fill="#0a84ff"/><text x="88" y="410.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="110" y="403">Reduz as fotos para 1024 px (aceita HEIC do iPhone)</text>
      <text x="110" y="419" font-size="11.5" fill="#8e8e93">e guarda miniaturas das notícias; se uma fonte falhar, mantém o último dado bom</text>
    </g>
    <g>
      <circle cx="88" cy="446" r="11" fill="#30d158"/><text x="88" y="450.5" font-size="12" font-weight="700" fill="#0b0d17" text-anchor="middle">3</text>
      <text x="110" y="443">Cifra os dados e cada foto com AES-CCM</text>
      <text x="110" y="459" font-size="11.5" fill="#8e8e93">a chave sai da senha do painel (PBKDF2-SHA256); nada pessoal sai aberto</text>
    </g>
    <g>
      <circle cx="88" cy="486" r="11" fill="#0a84ff"/><text x="88" y="490.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="110" y="483">Monta o site e põe “?v=versão” nos arquivos</text>
      <text x="110" y="499" font-size="11.5" fill="#8e8e93">assim o atalho da Tela de Início não fica preso numa versão velha</text>
    </g>
    <g>
      <circle cx="88" cy="526" r="11" fill="#0a84ff"/><text x="88" y="530.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <text x="110" y="523">Publica no branch</text>
      <text x="228" y="523" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#64d2ff">painel-site</text>
      <text x="110" y="539" font-size="11.5" fill="#8e8e93">um commit só, sem encher o histórico</text>
    </g>
  </g>

  <!-- Segredos -->
  <rect x="724" y="286" width="220" height="176" rx="16" fill="#2a2418" stroke="#ff9f0a" stroke-width="1.5"/>
  <text x="742" y="312" font-size="14.5" font-weight="700" fill="#ffd28a">Segredos do repositório</text>
  <text x="742" y="330" font-size="11" fill="#c7b89a">Settings → Secrets → Actions</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#ffe2b0">
    <text x="742" y="356">PAINEL_SENHA</text>
    <text x="742" y="376">GDRIVE_CREDENCIAIS</text>
    <text x="742" y="396">GDRIVE_PASTA</text>
    <text x="742" y="416">AGENDA_APPLE_URL</text>
  </g>
  <text x="742" y="442" font-size="11" fill="#c7b89a">só o robô lê; nunca vão para o site</text>
  <path d="M724,374 H700" stroke="#ff9f0a" stroke-width="2" fill="none" marker-end="url(#seta-l)"/>

  <!-- Cache -->
  <rect x="724" y="476" width="220" height="78" rx="16" fill="#1f2438" stroke="#3a4060"/>
  <text x="742" y="500" font-size="14" font-weight="600" fill="#f2f2f7">Cache do Actions</text>
  <text x="742" y="519" font-size="11.5" fill="#a1a1aa">fotos já reduzidas e cifradas</text>
  <text x="742" y="535" font-size="11.5" fill="#a1a1aa">não são baixadas de novo</text>

  <!-- Actions -> Pages -->
  <path d="M236,554 V624" stroke="#0a84ff" stroke-width="2" fill="none" marker-end="url(#seta)"/>

  <!-- ===== GitHub Pages ===== -->
  <rect x="36" y="626" width="404" height="292" rx="16" fill="#1f2438" stroke="#3a4060"/>
  <text x="56" y="650" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8e8e93">GITHUB PAGES · SITE PÚBLICO</text>
  <text x="56" y="674" font-size="17" font-weight="700" fill="#f2f2f7">Qualquer um abre, só a senha lê</text>
  <text x="56" y="694" font-size="12" fill="#64d2ff" font-family="Menlo, Consolas, monospace">jppaivasilva.github.io/iPad-Antigo</text>

  <g font-size="12.5" fill="#e5e5ea">
    <text x="56" y="728" font-family="Menlo, Consolas, monospace" font-size="12">index.html · app.js</text>
    <text x="56" y="745" font-family="Menlo, Consolas, monospace" font-size="12">style.css · sjcl.js</text>
    <text x="424" y="736" text-anchor="end" fill="#a1a1aa" font-size="11.5">abertos · só a tela de senha</text>

    <line x1="56" y1="760" x2="424" y2="760" stroke="#30364f"/>
    <use href="#cadeado" x="62" y="782"/>
    <text x="78" y="787" font-family="Menlo, Consolas, monospace" font-size="12">dados.txt</text>
    <text x="424" y="787" text-anchor="end" fill="#30d158" font-size="11.5">cifrado · tempo, notícias, dólar, agenda</text>

    <line x1="56" y1="802" x2="424" y2="802" stroke="#30364f"/>
    <use href="#cadeado" x="62" y="824"/>
    <text x="78" y="829" font-family="Menlo, Consolas, monospace" font-size="12">retratos/*.txt</text>
    <text x="424" y="829" text-anchor="end" fill="#30d158" font-size="11.5">cifrado · uma foto por arquivo</text>

    <line x1="56" y1="844" x2="424" y2="844" stroke="#30364f"/>
    <text x="56" y="871" font-family="Menlo, Consolas, monospace" font-size="12">img/</text>
    <text x="424" y="871" text-anchor="end" fill="#a1a1aa" font-size="11.5">miniaturas das notícias (já são públicas)</text>
    <text x="56" y="900" fill="#8e8e93" font-size="11.5">Mesmo site: o iPad não esbarra em CORS nem em certificados.</text>
  </g>

  <!-- Pages -> iPad -->
  <path d="M440,760 H526" stroke="#0a84ff" stroke-width="2" fill="none" marker-end="url(#seta)"/>
  <text x="483" y="736" font-size="11" fill="#a1a1aa" text-anchor="middle">dados.txt</text>
  <text x="483" y="750" font-size="11" fill="#a1a1aa" text-anchor="middle">a cada 10 min</text>

  <!-- Tempo ao vivo: iPad -> Open-Meteo (direto) -->
  <path d="M960,660 H990 V158 H968" stroke="#64d2ff" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#seta-v)"/>
  <text x="1006" y="410" font-size="11" fill="#64d2ff" text-anchor="middle" transform="rotate(90 1006 410)">tempo ao vivo, direto do iPad, a cada 15 min</text>

  <!-- ===== iPad ===== -->
  <rect x="530" y="610" width="430" height="320" rx="30" fill="#0e0f13" stroke="#5a5f70" stroke-width="2"/>
  <circle cx="944" cy="770" r="9" fill="none" stroke="#5a5f70" stroke-width="1.6"/>
  <circle cx="546" cy="770" r="3" fill="#2c2f3a"/>
  <rect x="562" y="632" width="364" height="276" rx="6" fill="#141a30" stroke="#262b40"/>

  <text x="580" y="658" font-size="14" font-weight="700" fill="#f2f2f7">iPad 2 · iOS 9 · Safari 9</text>
  <text x="580" y="677" font-size="11.5" fill="#a1a1aa">Atalho na Tela de Início, tela cheia, JavaScript ES5 puro.</text>
  <g>
    <use href="#cadeado" x="586" y="696"/>
    <text x="600" y="701" font-size="11.5" fill="#e5e5ea">Senha uma vez → sjcl.js decifra no próprio iPad</text>
  </g>

  <!-- tela painel -->
  <rect x="580" y="716" width="150" height="112" rx="10" fill="#1f2640" stroke="#0a84ff"/>
  <text x="594" y="738" font-size="13" font-weight="700" fill="#f2f2f7">Painel</text>
  <g font-size="11" fill="#c7c7cc">
    <text x="594" y="756">relógio (sem segundos)</text>
    <text x="594" y="771">tempo · 6 dias</text>
    <text x="594" y="786">agenda · notícias</text>
    <text x="594" y="801">cotação do dólar</text>
    <text x="594" y="816" fill="#8e8e93">recarrega a cada 6 h</text>
  </g>

  <!-- deslizar -->
  <g font-size="10.5" fill="#a1a1aa" text-anchor="middle">
    <path d="M736,758 H752" stroke="#c7c7cc" stroke-width="1.6" fill="none" marker-end="url(#seta-v)"/>
    <path d="M770,786 H754" stroke="#c7c7cc" stroke-width="1.6" fill="none" marker-end="url(#seta-v)"/>
    <text x="753" y="748">deslize</text>
    <text x="753" y="804">volta</text>
  </g>

  <!-- tela fotos -->
  <rect x="774" y="716" width="134" height="112" rx="10" fill="#1d2a24" stroke="#30d158"/>
  <text x="788" y="738" font-size="13" font-weight="700" fill="#f2f2f7">Fotos</text>
  <g font-size="11" fill="#c7c7cc">
    <text x="788" y="756">porta-retratos</text>
    <text x="788" y="771">troca a cada 15 s</text>
    <text x="788" y="786">pontinhos no rodapé</text>
    <text x="788" y="801">mostram a tela</text>
  </g>

  <!-- noturno -->
  <rect x="580" y="840" width="328" height="54" rx="10" fill="#000" stroke="#48484a"/>
  <rect x="594" y="850" width="30" height="34" rx="5" fill="#1c1c1e"/>
  <rect x="628" y="850" width="30" height="34" rx="5" fill="#1c1c1e"/>
  <line x1="594" y1="867" x2="658" y2="867" stroke="#000" stroke-width="1.5"/>
  <text x="609" y="874" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="643" y="874" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="672" y="862" font-size="12.5" font-weight="700" fill="#f2f2f7">23h às 6h: relógio flip</text>
  <text x="672" y="879" font-size="11" fill="#a1a1aa">toque sai · volta após 5 min parado</text>

  <!-- rodapé -->
  <text x="36" y="958" font-size="11.5" fill="#8e8e93">A hora vem do servidor (cabeçalho Date) e o fuso da cidade, porque o iOS 9 ainda acha que o Brasil tem horário de verão.</text>
</svg>
