name: Diagnostico certificado
on: [push]
jobs:
  cert:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          for h in jppaivasilva.github.io api.open-meteo.com; do
            echo "=== $h"
            timeout 20 openssl s_client -4 -connect $h:443 -servername $h -showcerts </dev/null 2>/dev/null | grep -E "^ *[0-9] s:|^ *i:" || echo falhou
          done
