name: Diagnostico certificado
on: [push]
jobs:
  cert:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in jppaivasilva.github.io api.open-meteo.com; do
            echo "=== $h"
            echo | openssl s_client -connect $h:443 -servername $h -showcerts 2>/dev/null | grep -E "^ *[0-9] s:|^ *i:|NotBefore|NotAfter"
            echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -issuer -dates
          done
