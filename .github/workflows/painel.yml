name: Painel do iPad

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  push:
    branches: [main, master]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: painel
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fotos já reduzidas e cifradas ficam guardadas entre execuções,
      # para não baixar tudo do Drive a cada 30 minutos.
      - uses: actions/cache@v4
        with:
          path: retratos
          key: retratos-${{ github.run_id }}
          restore-keys: retratos-

      - name: Baixar tempo, notícias, fotos e agenda
        env:
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          GDRIVE_CREDENCIAIS: ${{ secrets.GDRIVE_CREDENCIAIS }}
          GDRIVE_PASTA: ${{ secrets.GDRIVE_PASTA }}
          AGENDA_APPLE_URL: ${{ secrets.AGENDA_APPLE_URL }}
        run: |
          pip install --quiet pillow pillow-heif cryptography google-auth requests icalendar recurring-ical-events
          python scripts/gerar_dados.py

      - name: Montar site
        run: |
          mkdir site && cp -r index.html relogio.html style.css sjcl.js app.js dados.txt img retratos site/   # data.json (aberto) não vai
          # Versão no endereço dos arquivos: o atalho da Tela de Início guarda
          # app.js/style.css antigos; com ?v= novo a cada mudança ele busca de novo.
          v=$(cat index.html style.css sjcl.js app.js | sha1sum | cut -c1-8)
          sed -i -E "s/(style\.css|sjcl\.js|app\.js)\"/\1?v=$v\"/g" site/index.html
          grep -E "\?v=" site/index.html

      - name: Publicar no branch painel-site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: painel-site
          publish_dir: ./site
          force_orphan: true   # mantém só 1 commit, sem encher o histórico
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Atualiza painel
